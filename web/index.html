<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f9f6">
 <title>Atlas — Your world, in layers</title><meta name="description" content="A personal map for your places, your paths, and your people. Built on OpenStreetMap.">
 <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest">
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/style.css">
</head>
<body>
 <svg class="symbol-bank" xmlns="http://www.w3.org/2000/svg"><defs>
 <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
 <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/></symbol>
 <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><path d="M9 18h7a4 4 0 0 0 0-8H8a3 3 0 0 1 0-6h10m-3-3 3 3-3 3"/></symbol>
 <symbol id="i-friends" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5v1"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
 <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h13v9a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Zm13 1h2a3 3 0 1 1 0 6h-2M7 2v2m5-2v2"/></symbol>
 <symbol id="i-food" viewBox="0 0 24 24"><path d="M4 3v6a3 3 0 0 0 6 0V3M7 3v18M20 21V3c-4 1-5 8-5 10h5"/></symbol>
 <symbol id="i-bag" viewBox="0 0 24 24"><path d="M4 8h16l1 13H3L4 8ZM8 8V6a4 4 0 0 1 8 0v2"/></symbol>
 <symbol id="i-car" viewBox="0 0 24 24"><path d="m4 10 2-6h12l2 6M3 10h18v8H3v-8Zm2 8v3m14-3v3M6 14h1m10 0h1"/></symbol>
 <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
 <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3Z"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
 <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></symbol>
 <symbol id="i-pen" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6L16 3Zm-3 3 5 5"/></symbol>
 <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
 </defs></svg>
 <nav class="rail" aria-label="Main navigation">
  <a class="brand-mark" href="/" aria-label="Atlas home"><svg><use href="#i-layers"/></svg></a>
  <div class="rail-items">
   <button data-view="layers" class="rail-button active" aria-label="Layers" title="Layers"><svg><use href="#i-layers"/></svg><span>Layers</span></button>
   <button data-view="lists" class="rail-button" aria-label="My lists" title="My lists"><svg><use href="#i-bookmark"/></svg><span>Lists</span></button>
   <button data-view="directions" class="rail-button" aria-label="Directions" title="Directions"><svg><use href="#i-route"/></svg><span>Routes</span></button>
   <button data-view="friends" class="rail-button" aria-label="Friends" title="Friends"><svg><use href="#i-friends"/></svg><span>Friends</span></button>
  </div>
  <button id="about-button" class="rail-bottom icon-button" title="About Atlas" aria-label="About Atlas"><svg><use href="#i-info"/></svg></button>
  <button id="account-button" class="account-avatar" title="Sign in with Gravitas" aria-label="Account">G</button>
 </nav>
 <aside class="sidebar" id="sidebar">
  <header class="sidebar-brand"><span>atlas<span class="brand-dot">.</span></span><span class="edition">A LITTLE MORE LOCAL</span><button id="panel-close" class="icon-button mobile-only" aria-label="Close panel"><svg><use href="#i-close"/></svg></button></header>
  <div id="panel-content" class="panel-content"></div>
  <footer class="sidebar-footer"><span class="status-dot"></span><span id="sync-status">Your map. Your perspective.</span><span class="footer-version">v1.0</span></footer>
 </aside>
 <main class="workspace">
  <header class="topbar">
   <div class="location-heading"><span class="tiny-label">EXPLORING</span><button id="city-button">Toronto, Canada <span>⌄</span></button></div>
   <form id="search-form" class="search-box" role="search"><svg><use href="#i-search"/></svg><input id="search-input" aria-label="Search places and addresses" autocomplete="off" placeholder="Search a place, an address, a possibility…"><kbd>↵</kbd></form>
   <a href="https://apps.gravitas.cool/apps/atlas" class="android-link" target="_blank" rel="noopener"><svg><use href="#i-phone"/></svg><span>Get the app</span><svg class="small-icon"><use href="#i-arrow"/></svg></a>
  </header>
  <section class="map-wrap" aria-label="Interactive map">
   <div id="map"></div>
   <div class="map-top"><div class="category-chips" aria-label="Filter places">
    <button class="chip active" data-category="all"><svg><use href="#i-pin"/></svg>All places</button>
    <button class="chip" data-category="cafe"><svg><use href="#i-coffee"/></svg>Coffee</button>
    <button class="chip" data-category="restaurant"><svg><use href="#i-food"/></svg>Food & drink</button>
    <button class="chip" data-category="shop"><svg><use href="#i-bag"/></svg>Shopping</button>
   </div><button id="search-area" class="chip area-button"><svg><use href="#i-search"/></svg>Search this area</button></div>
   <div id="search-results" class="search-results" hidden></div>
   <div class="map-controls"><button id="locate-button" class="control-button" title="Find my location" aria-label="Find my location"><svg><use href="#i-locate"/></svg></button><div class="zoom-group"><button id="zoom-in" class="control-button" aria-label="Zoom in">+</button><button id="zoom-out" class="control-button" aria-label="Zoom out">−</button></div></div>
   <button id="mobile-panel-button" class="mobile-panel-button"><svg><use href="#i-layers"/></svg> Your layers <span id="mobile-layer-count">3</span></button>
   <div class="map-bottom"><div class="map-credit"><svg><use href="#i-globe"/></svg><span>Made for the way you move.</span></div><button id="fit-button" class="map-layer-pill"><svg><use href="#i-layers"/></svg><span id="active-layer-count">3 layers on</span><span class="layer-dots"><i></i><i></i><i></i></span></button></div>
   <div id="map-detail" class="map-detail" hidden></div>
   <div id="drawing-bar" class="drawing-bar" hidden><span>Tap the map to highlight a path</span><button id="finish-drawing" class="primary small">Save highlight</button><button id="cancel-drawing" class="icon-button" aria-label="Cancel drawing"><svg><use href="#i-close"/></svg></button></div>
  </section>
 </main>
 <div id="toast" class="toast" role="status" hidden></div>
 <dialog id="modal"><form id="modal-form"><button type="button" id="modal-close" class="modal-close icon-button" aria-label="Close dialog"><svg><use href="#i-close"/></svg></button><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div></form></dialog>
 <script src="/vendor/leaflet.js"></script><script src="/app.js" defer></script>
</body></html>
