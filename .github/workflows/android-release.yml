name: Signed Android release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an unused version after signature and upload verification
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: signed-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/test-android-release.py
      - name: Require a version-matched machine-readable changelog
        run: python3 scripts/android-release.py validate
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... && go vet ./...
  plan:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refuse reused tags and non-upgrade versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        run: python3 scripts/android-release.py plan
  release:
    if: needs.plan.outputs.build == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    environment: android-release
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test before loading signing credentials
        working-directory: android
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build with the original permanent signing identity
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 scripts/android-release.py build
      - name: Remove signing material even after interruption
        if: always()
        run: rm -f "$RUNNER_TEMP/android-permanent-release.jks"
      - name: Verify certificate, package, version and APK checksum
        run: python3 scripts/android-release.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-android-${{ needs.plan.outputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/android-release-dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish only after all uploaded assets verify
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/android-release.py publish
